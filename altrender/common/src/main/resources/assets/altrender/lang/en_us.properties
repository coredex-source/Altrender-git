altrender.options.impact.low=Low
altrender.options.impact.medium=Medium
altrender.options.impact.high=High
altrender.options.impact.varies=Varies
altrender.options.requires_restart=Takes effect after a game restart.
altrender.options.page.general=General
altrender.options.page.quality=Quality
altrender.options.page.performance=Performance
altrender.options.page.advanced=Advanced
altrender.options.no_limit=No limit
altrender.options.vsync=VSync
altrender.options.vsync.tooltip=Waits for the display before showing each frame, so frames don't tear. Where the driver supports it, a late frame tears instead of waiting a whole refresh (adaptive). Off can give more FPS than the display shows.
altrender.options.mesh_threads=Chunk Builder Threads
altrender.options.mesh_threads.tooltip=How many threads build terrain meshes. More build chunks faster when moving quickly, at the cost of CPU time for the rest of the game. Auto leaves two cores free.
altrender.options.upload_budget=Chunk Upload Budget
altrender.options.upload_budget.tooltip=At most this much new terrain is sent to the GPU per frame; the rest waits for the next one. Higher fills the world in faster; lower smooths out frames while loading.
altrender.options.cave_culling=Cave Culling
altrender.options.cave_culling.tooltip=Skips terrain the camera can't see through solid ground (caves, the far side of hills). Through a gap between two blocks it can rarely hide a sliver of distant terrain.
altrender.options.entity_culling=Entity Culling
altrender.options.entity_culling.tooltip=Skips mobs, items and block entities (signs, chests) in terrain that cave culling hides. The picture is the same.
altrender.options.idle_fps=Minimised Frame Rate
altrender.options.idle_fps.tooltip=The most frames per second while the window is minimised, to save power.
altrender.options.unfocused_fps=Background Frame Rate
altrender.options.unfocused_fps.tooltip=The most frames per second while another window has focus.
altrender.options.immediate_stream=Stream Buffer for Small Draws
altrender.options.immediate_stream.tooltip=Sends the game's small draws (entities, particles, weather, text) through one GPU buffer instead of copying them on every draw. No faster on average; can steady frame times on some GPUs.
altrender.options.renderer=Renderer
altrender.options.renderer.tooltip=Which OpenGL version Altrender renders with. The newer one is faster where the driver supports it; the picture is the same. Switches immediately.
altrender.options.gpu_commands=GPU-Driven Terrain Commands
altrender.options.gpu_commands.tooltip=Lets the GPU write the terrain's draw commands. Measured slightly slower than the default; for testing.
altrender.options.render_distance.tooltip=How far terrain is drawn, in chunks (16 blocks) from you. The game's own steps are named: Tiny 2, Short 4, Normal 8, Far 13. Farther is slower and takes more memory.
altrender.options.max_framerate.tooltip=The most frames per second while the game has focus. Lower saves power; Unlimited draws as fast as possible (VSync still waits for the display).
altrender.options.gui_scale.tooltip=The size of menus and the hotbar. Auto picks the largest that fits the window.
altrender.options.fullscreen.tooltip=Covers the whole screen.
altrender.options.view_bobbing.tooltip=The view bobs while walking.
altrender.options.anaglyph.tooltip=Red-cyan 3D glasses.
altrender.options.graphics.tooltip=Fancy draws leaves and water transparently, clouds and sky in detail, and dropped items as 3D models. Fast is quicker.
altrender.options.smooth_lighting.tooltip=Shades blocks smoothly between light levels instead of one level per face.
altrender.options.advanced_opengl.tooltip=The game's own hardware occlusion test for terrain.
altrender.options.advanced_opengl.unavailable=Altrender's terrain culls hidden sections itself: this only does something with Altrender off.
altrender.options.fullscreen=Fullscreen
altrender.options.max_framerate=Max Framerate
altrender.options.unlimited=Unlimited
altrender.debug.page=Debug Screen
altrender.debug.frame_chart=Frame Time Chart (F3+1)
altrender.debug.frame_chart.tooltip=The last 240 frames' times, with lines at 60 and 30 FPS and the 95th and 99th percentile.
altrender.debug.gpu_chart=GPU Time per Pass (F3+2)
altrender.debug.gpu_chart.tooltip=How long the GPU spends on each part of the frame (terrain, sky, entities, ...), averaged over a second. Times the passes while it's shown.
altrender.debug.always=Always
altrender.debug.with_f3=With F3
altrender.debug.never=Never
altrender.debug.entry.system=System (Java, memory, CPU)
altrender.debug.entry.gl=Graphics card and driver
altrender.debug.entry.altrender=Altrender (renderer, terrain)
altrender.debug.entry.game=Game (version, FPS)
altrender.debug.entry.renderer=The game's renderer counts
altrender.debug.entry.position=Position and facing
altrender.debug.entry.world=Biome, light, dimension
altrender.debug.entry.target=Targeted block
altrender.debug.entry.display=Display
altrender.options.modern_debug_screen=Modern F3 Screen
altrender.options.modern_debug_screen.tooltip=Altrender's debug screen (F3): two columns as in newer versions, Altrender's renderer and GPU details, a frame-time chart (F3+1) and GPU times (F3+2); F3+F6 picks what shows. Off: the game's own.
altrender.options.fps_counter=FPS Counter
altrender.options.fps_counter.tooltip=Shows the frame rate in a corner of the screen (hidden while F3 is open). Advanced adds the lowest and average frame rate of the last second and the frame time.
altrender.options.fps_counter.off=Off
altrender.options.fps_counter.simple=Simple
altrender.options.fps_counter.advanced=Advanced
altrender.options.fps_counter_gpu=FPS Counter: GPU Time
altrender.options.fps_counter_gpu.tooltip=Adds how long the GPU takes per frame (measured while shown).
altrender.options.fps_counter_corner=FPS Counter: Position
altrender.options.corner.top_left=Top left
altrender.options.corner.top_right=Top right
altrender.options.corner.bottom_left=Bottom left
altrender.options.corner.bottom_right=Bottom right
altrender.options.fps_counter_contrast=FPS Counter: Text Contrast
altrender.options.fps_counter_contrast.tooltip=Keeps the counter readable over bright scenes: a dark background behind it, or a shadow.
altrender.options.contrast.none=None
altrender.options.contrast.background=Background
altrender.options.contrast.shadow=Shadow
