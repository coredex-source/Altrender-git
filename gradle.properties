# Project
mod_version=0.1.0-alpha.4
maven_group=com.coredex
mod_author=Coredex
# Owner, 2026-11-11: both mods LGPL-3.0-only.
license=LGPL-3.0-only

# Java 21 and newer (owner requirement 2): bytecode targets 21; dev runs cover 21 and 25.
java_version=21

# Ornithe gen2 toolchain, checked 2026-11-11 against meta.ornithemc.net and the Ornithe/Fabric/KikuGie mavens.
# Ploceus 1.19.x builds against Loom 1.19; Loom 1.19 needs Gradle 9.8 running on Java 25.
loom_version=1.19.4
ploceus_version=1.19.1
stonecutter_version=0.9.8
intermediary_generation=2
# https://meta.ornithemc.net/v3/versions/fabric-loader (latest stable)
fabric_loader_version=0.20.1

# Runtime dependency (owner requirement 10). Modrinth: legacyfix (betacraftuk/legacyfix, GPL-3.0), never bundled.
legacyfix_version=26.10

# Embedded LWJGL (owner requirement 1). Modules nested in Altrender's jar (development.md 0.4/0.5).
lwjgl_version=3.4.3
lwjgl_modules=lwjgl,lwjgl-opengl,lwjgl-openal,lwjgl-sdl,lwjgl-stb
# Native platforms (LWJGL classifier suffixes), packed into altrender/natives/<os>-<arch>/ (development.md 0.5).
# No macOS (owner).
lwjgl_natives=linux,linux-arm64,windows,windows-arm64
# OpenAL Soft as LWJGL 3.4.3 built it (the natives jars' libopenal.so.git / OpenAL.dll.git, every platform). LGPL: its
# source goes with every release (owner, 2026-11-12): ./gradlew :altrender:lwjgl2:openalSource.
openal_soft_commit=7f9c6de1162b1d4604b9a2f8bcd6c53021566221
openal_soft_source_sha256=a6423b0efd2fee3d7d07c169388e7bf453aab5d5b57fb9bc335d970b7e44e397

# Minecraft versions: versions/<mc>.properties.

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Groovy buildscripts by choice; silences Stonecutter's Kotlin DSL notice.
dev.kikugie.stonecutter.hard_mode=true
