pluginManagement {
    // Altrender's own build tasks (LWJGL merge/nesting): plugin id altrender.build.
    includeBuild('build-logic')
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Ornithe Releases'
                    url = uri('https://maven.ornithemc.net/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('net.ornithemc')
                includeGroup('ploceus')
                // Ploceus' signature patcher
                includeGroup('io.github.gaming32')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'KikuGie'
                    url = uri('https://maven.kikugie.dev/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('dev.kikugie')
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
    plugins {
        // Versions live in gradle.properties (pinned in development.md 0.1).
        id 'net.fabricmc.fabric-loom-remap' version providers.gradleProperty('loom_version').get()
        id 'ploceus' version providers.gradleProperty('ploceus_version').get()
        id 'dev.kikugie.stonecutter' version providers.gradleProperty('stonecutter_version').get()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Multi-version builds (development.md Phase 9): https://stonecutter.kikugie.dev
    id 'dev.kikugie.stonecutter'
}

rootProject.name = 'Altrender'

// Version-independent projects: plain Java, no Minecraft or loader types (development.md 0.4).
include ':altrender:api'
include ':altrender:common'
// LWJGL2's API on LWJGL 3 + SDL3 + OpenAL Soft, and the LWJGL jars Altrender nests (development.md 0.4).
include ':altrender:lwjgl2'
include ':altshaders:common'

// One Stonecutter tree per mod's Minecraft-facing project: :altrender:mc:<mc> and :altshaders:mc:<mc>. Each tree has
// its own controller (<tree>/stonecutter.gradle) and shares the central script <tree>/build.gradle across its nodes.
// Per-version values: versions/<mc>.properties (shared by both trees). The ladder adds versions here (Phase 9).
// vers(project name, semantic version): Fabric Loader's normalised version, so //? if >=1.0 comparisons work.
def mcVersions = ['b1.7.3': '1.0.0-beta.7.3']
stonecutter {
    kotlinController = false
    centralScript = 'build.gradle'
    create([':altrender:mc', ':altshaders:mc']) {
        mcVersions.each { name, semver -> vers(name, semver) }
        vcsVersion = 'b1.7.3'
    }
}
